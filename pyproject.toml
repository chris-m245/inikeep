[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inikeep"
version = "0.1.0"
description = "A round-trip INI parser that preserves comments, blank lines, and key order"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "chris-m245" }]

[tool.setuptools.packages.find]
include = ["inikeep*"]
